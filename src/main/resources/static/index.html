<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>震相合议室</title>
<style>
:root { --bg:#0f1420; --panel:#18203000; --ink:#e8edf6; --muted:#8da0bd; --line:#2a3550;
  --accent:#6ea8fe; --p:#ff9d5c; --s:#7ee787; --warn:#ff6b6b; --ok:#3ddc97; }
* { box-sizing: border-box; }
body { margin:0; font:13px/1.45 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); }
header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
header h1 { font-size:17px; margin:0; letter-spacing:2px; }
nav { display:flex; gap:6px; flex-wrap:wrap; }
button, select, input { font:inherit; background:#1b2536; color:var(--ink); border:1px solid var(--line);
  border-radius:6px; padding:4px 9px; }
button { cursor:pointer; }
button:hover { border-color:var(--accent); }
main { padding:12px 16px; display:grid; gap:12px; }
.card { background:#151d2c; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
.card h2 { font-size:13px; margin:0 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
table { border-collapse:collapse; width:100%; }
th, td { border-bottom:1px solid #232e45; padding:4px 7px; text-align:left; white-space:nowrap; }
th { color:var(--muted); font-weight:600; }
tr.win td.good { color:var(--ok); } tr.out td.bad { color:var(--warn); }
.muted { color:var(--muted); }
.tag { display:inline-block; padding:0 6px; border-radius:10px; background:#24314b; font-size:11px; }
.tag.frozen { background:#274a3c; color:var(--ok); }
.tag.open { background:#3a2f4f; color:#c9a7ff; }
canvas { background:#0b101b; border:1px solid var(--line); border-radius:8px; width:100%; display:block; }
.small { font-size:11px; }
#toast { position:fixed; right:14px; bottom:14px; max-width:420px; background:#222c40;
  border:1px solid var(--line); border-radius:8px; padding:9px 12px; display:none; white-space:pre-wrap; }
#toast.error { border-color:var(--warn); }
label { color:var(--muted); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:980px){ .grid2 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>震相合议室</h1>
  <nav>
    <select id="interpSel"></select>
    <button id="btnRefresh">刷新</button>
    <button id="btnUndo">撤销</button>
    <button id="btnClockReport">校时检查</button>
    <button id="btnFreeze">冻结解释</button>
    <button id="btnBranch">复制分支…</button>
  </nav>
  <span id="interpMeta" class="muted small"></span>
</header>
<main>
  <section class="card">
    <h2>同步波形 · 理论到时 · 候选与置信区间</h2>
    <div class="row" style="margin-bottom:8px">
      <label>窗口中心(ms)</label><input id="wfCenter" type="number" value="1000000" style="width:120px">
      <label>窗口宽度(ms)</label><input id="wfSpan" type="number" value="20000" style="width:90px">
      <button id="btnWfApply">应用</button>
      <span class="muted small">橙色=P 拾取，绿色=S 拾取；竖线为理论到时，浅色区间为置信区间；削顶样本以红色描点。</span>
    </div>
    <canvas id="waveCanvas" height="420"></canvas>
  </section>

  <div class="grid2">
    <section class="card">
      <h2>候选拾取（可移动 / 极性 / 置信区间 / 合并 / 噪声）</h2>
      <div class="row" style="margin-bottom:6px">
        <button id="btnAdd">新增候选</button>
        <button id="btnMerge">合并选中</button>
        <button id="btnNoise">标记噪声</button>
        <button id="btnActive">恢复有效</button>
      </div>
      <div style="max-height:280px; overflow:auto"><table id="candTable"></table></div>
    </section>
    <section class="card">
      <h2>台站校时修正</h2>
      <div class="row">
        <select id="clockStation"></select>
        <input id="clockMs" type="number" value="0" style="width:110px">
        <button id="btnClockApply">应用修正</button>
      </div>
      <p class="muted small">若修正使近震中台站的观测 P 到时晚于远震中台站，冻结将被阻止并返回最小冲突台站集合。</p>
    </section>
  </div>

  <section class="card">
    <h2>模型比较（预测差 / 观测差 / 权重来源）</h2>
    <div class="row" style="margin-bottom:8px">
      <label>残差窗口(ms)</label><input id="windowMs" type="number" value="3000" style="width:90px">
      <button id="btnCompare">比较全部模型</button>
      <span id="compareWinners" class="muted small"></span>
    </div>
    <div style="max-height:260px; overflow:auto"><table id="scoreTable"></table></div>
    <h2 style="margin-top:12px">按台站对比</h2>
    <div style="max-height:320px; overflow:auto"><table id="stationCmpTable"></table></div>
  </section>

  <section class="card">
    <h2>残差图</h2>
    <canvas id="residualCanvas" height="220"></canvas>
  </section>

  <section class="grid2">
    <div class="card"><h2>解释 / 分支</h2><div id="interpList"></div></div>
    <div class="card"><h2>事件流（撤销历史）</h2><div id="eventLog" style="max-height:240px; overflow:auto"></div></div>
  </section>
</main>
<div id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
